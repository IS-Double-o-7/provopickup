<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rally Provo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<!-- Asset version. GitHub Pages serves every file with Cache-Control: max-age=600,
     and index.html, styles.css and app.js each expire on their own clock. Without a
     version here a browser can pair a NEW index.html with a STALE styles.css, which
     renders the availability grid as scrambled boxes rather than failing visibly.
     BUMP THIS whenever you change styles.css, config.js, auth.js or app.js:
     today's date, plus -2, -3 and so on for further deploys the same day. -->
<link rel="stylesheet" href="styles.css?v=2026-11-11-courts-2">
</head>
<body>
<div class="auth" id="auth">
  <div class="auth-art" aria-hidden="true">
    <svg class="auth-court" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice"><rect width="300" height="400" fill="var(--auth-surround)"/><rect x="60" y="40" width="180" height="320" fill="var(--auth-court)"/><g stroke="rgba(255,255,255,.82)" stroke-width="3" fill="none"><rect x="60" y="40" width="180" height="320"/><path d="M60 149H240M60 251H240M150 40V149M150 251V360"/></g><path d="M48 200H252" stroke="rgba(8,18,24,.55)" stroke-width="6"/></svg>
    <div class="auth-art-copy">
      <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--ball)"/><path d="M5 9c7 3 9 11 4 19M27 9c-7 3-9 11-4 19" fill="none" stroke="var(--ball-ink)" stroke-opacity=".5" stroke-width="2"/></svg>Rally<small>Provo</small></div>
      <p class="auth-pitch">Find people to play with around Provo.</p>
      <p class="auth-pitch-sub">Match with players at your level, plan a game, and get on the court.</p>
    </div>
  </div>
  <div class="auth-panel" role="main">
    <div class="auth-box">
      <div class="auth-tabs" id="authTabs" role="tablist" aria-label="Log in or sign up">
        <button type="button" role="tab" id="authTabLogin" aria-controls="authForm" data-auth-mode="login" class="active" aria-selected="true">Log in</button>
        <button type="button" role="tab" id="authTabSignup" aria-controls="authForm" data-auth-mode="signup" aria-selected="false" tabindex="-1">Sign up</button>
      </div>
      <h1 id="authTitle">Welcome back</h1>
      <p class="muted" id="authSub">Log in to find your next game.</p>
      <p class="muted auth-loading" id="authLoading" role="status">Checking your sign-in…</p>
      <form class="form auth-form" id="authForm" role="tabpanel" aria-labelledby="authTitle" novalidate hidden>
        <div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" required placeholder="you@example.com"></div>
        <div class="field"><label for="authPassword">Password</label><div class="pw-wrap"><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required aria-describedby="authPwHint"><button type="button" class="pw-toggle" data-pw-toggle="authPassword" aria-controls="authPassword" aria-pressed="false" aria-label="Show password"><svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-shut" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.9 3.8M6.6 6.6A17.2 17.2 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg></button></div><small class="muted" id="authPwHint" hidden>At least 6 characters.</small></div>
        <div class="field" id="authConfirmField" hidden><label for="authConfirm">Confirm password</label><div class="pw-wrap"><input id="authConfirm" type="password" autocomplete="new-password" minlength="6"><button type="button" class="pw-toggle" data-pw-toggle="authConfirm" aria-controls="authConfirm" aria-pressed="false" aria-label="Show confirm password"><svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-shut" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.9 3.8M6.6 6.6A17.2 17.2 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg></button></div></div>
        <p class="auth-msg" id="authMsg" role="alert" hidden></p>
        <button class="btn auth-submit" type="submit" id="authSubmit">Log in</button>
      </form>
    </div>
  </div>
</div>

<div class="onboard" id="onboard" role="main" hidden></div>

<div class="app" id="app" hidden>
  <aside class="side" aria-label="Main navigation">
    <a class="brand" href="#home" data-route="home" aria-label="Rally Provo, go to Home"><span id="brandMark"></span>Rally<small>Provo</small></a>
    <nav id="sideNav"></nav>
    <div class="side-foot"><button class="me-btn" data-action="open-profile" id="sideMe"></button></div>
  </aside>
  <div class="min0">
    <header class="topbar">
      <a class="brand" href="#home" data-route="home" aria-label="Rally Provo, go to Home"><span id="brandMark2"></span>Rally</a>
      <button class="me-btn" style="width:auto" data-action="open-profile" id="topMe" aria-label="Your profile"></button>
    </header>
    <main id="main">
      <section class="view" data-view="home" id="v-home"></section>
      <section class="view" data-view="play" id="v-play"></section>
      <section class="view" data-view="messages" id="v-messages"></section>
      <section class="view" data-view="courts" id="v-courts"></section>
      <section class="view" data-view="calendar" id="v-calendar"></section>
      <section class="view" data-view="reels" id="v-reels"></section>
      <section class="view" data-view="challenge" id="v-challenge"></section>
      <section class="view" data-view="stats" id="v-stats"></section>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation"></nav>
</div>

<div class="modal" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" id="modalCard"></div></div>
<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<script src="config.js?v=2026-11-11-courts-2"></script>
<script src="auth.js?v=2026-11-11-courts-2"></script>
<script src="app.js?v=2026-11-11-courts-2"></script>
</body>
</html>
